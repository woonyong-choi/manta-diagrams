<!doctype html><html lang="en" class="__THEME__"><head><meta charset="utf-8"><title>Manta Diagrams · edit Mermaid</title>
<link rel="stylesheet" href="assets/product.css"><style>
__HOST_CSS__
*{box-sizing:border-box;cursor:none!important;caret-color:transparent!important}
html,body{margin:0;width:100%;height:100%;overflow:hidden;font-family:"Apple SD Gothic Neo","Noto Sans KR",system-ui,sans-serif}
#manta-intro{position:relative;width:100%;height:100%;padding:40px 48px;background:var(--md-paper);color:var(--md-ink)}
.top{height:64px;display:flex;align-items:flex-start;justify-content:space-between;font-size:32px;border-bottom:1px solid var(--md-border)}
.brand{font-weight:650}.category{font-size:28px;color:var(--md-muted)}
.screen{position:absolute;left:48px;right:48px;top:138px;height:640px;border:1px solid var(--md-border);border-radius:8px;overflow:hidden}
.shot{position:absolute;inset:0}.runtime{height:100%;background:var(--md-paper)}
.diagram-runtime{display:grid;grid-template-columns:400px 1fr}
.diagram-code-pane{border-right:1px solid var(--md-border);padding:24px}
.diagram-pane-title{margin:0 0 24px;font-size:28px;line-height:1.3;color:var(--md-muted)}
.diagram-source{margin:0;font:30px/1.6 ui-monospace,monospace;white-space:pre-wrap;overflow-wrap:anywhere;color:var(--md-ink)}
.diagram-output{position:relative;padding:24px;min-width:0;min-height:0}
.diagram-output .diagram-pane-title{position:absolute;top:24px;left:24px}
.diagram-output svg{display:block;width:100%;height:100%}
.details{position:absolute;left:48px;right:48px;top:808px;height:38px;font-size:30px;line-height:1.2}
.caption{position:absolute;inset:0;margin:0}
.bottom{position:absolute;left:48px;right:48px;bottom:16px;font-size:18px;color:var(--md-muted)}
.shot *{animation:none!important;transition:none!important}
</style><script src="assets/gsap.min.js"></script></head><body>
<div id="manta-intro" class="md-surface" data-composition-id="manta-intro" data-width="1600" data-height="900" data-duration="6">
<div class="top"><span class="brand">Manta Diagrams</span><span class="category">Edit Mermaid. Read the result.</span></div>
<div class="screen"><div id="runtime" class="runtime"></div></div>
<div class="details"></div>
<div class="bottom">Shared product renderer · Sample edits · Timing condensed · Not a native Obsidian recording</div>
</div><script>window.__timelines = {};</script><script type="module" src="assets/action.js"></script></body></html>
